packages:
  - 'packages/*'
  - 'products/*'
  - 'products/*/examples-site'
  - 'plugins/*'
  # Worked examples backing the developer guides. Private (never published);
  # consumed as packed tarballs by component_tests/plugin-vite, which is how a
  # third-party plugin actually resolves @jbrowse/* packages.
  - 'example-plugins/*'
  - 'website'
# astro2tsx pins @emnapi/core but takes @emnapi/runtime as a peer, and the two
# must be the same release. Left to the peer, pnpm dedupes it onto the 2.0
# beta that rolldown's wasm32 binding brings in, and `astro check` dies loading
# astro2tsx with `this.bridge.setLastError is not a function`. Drop this once
# astro2tsx depends on the runtime itself (withastro/compiler-rs#214, fix in
# #219).
packageExtensions:
  '@astrojs/astro2tsx@0.1':
    dependencies:
      '@emnapi/runtime': 1.11.3
blockExoticSubdeps: true
# A workspace cycle is a warning by default, and the tree carried 127 of them
# unread. They all came from two edges that had a way out: three plugins taking
# a `dependencies` edge on plugin-data-management for two model types core
# already states structurally, and seven declaring `@jbrowse/web` a
# devDependency for `createTestSession`, which the root package.json already
# declares for the whole tree. Failing the install is what keeps the next one
# from arriving unnoticed.
disallowWorkspaceCycles: true
allowBuilds:
  # Native file-watcher binding; the JS fallback is a polling stat loop. Left at
  # pnpm's "set this to true or false" placeholder, which fails `pnpm install`
  # outright — and so every `pnpm <script>`, since they all run a deps check
  # first.
  '@parcel/watcher': true
  electron: true
  electron-chromedriver: true
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  # Installed only as jest's jsdom environment's optional peer, a leftover of
  # jsdom 30; jsdom 31 draws through @napi-rs/canvas, so nothing loads it and
  # its native build would be wasted.
  canvas: false
  # Its postinstall only clears macOS quarantine, which an npm tarball never
  # carries; the prebuilt dawn.node needs no build step.
  webgpu: false
minimumReleaseAge: '1440'
minimumReleaseAgeExclude:
  - '@gmod/*'
  - 'ixixx'
  - 'electron'
  # Same publisher and same release train as `electron` above, so the two have
  # to clear the age gate together: the E2E jobs drive the packaged app through
  # ChromeDriver, and a driver a major behind refuses the session outright
  # ("only supports Chrome version 150"). Excluding one and not the other made
  # every electron major bump break those jobs for a day.
  - 'electron-chromedriver'
  - 'generic-filehandle2'
  - '@jbrowse/mobx-state-tree'
  - '@jbrowse/jexl'
  - '@jbrowse/quick-lru'
  - 'typescript'
  - '@typescript/*'
  - 'astro'
  - '@astrojs/*'
