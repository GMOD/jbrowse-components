packages:
  - 'packages/*'
  - 'products/*'
  - 'products/*/examples-site'
  - 'plugins/*'
  # Worked examples backing the developer guides. Private (never published);
  # consumed as packed tarballs by component_tests/plugin-vite, which is how a
  # third-party plugin actually resolves @jbrowse/* packages.
  - 'example-plugins/*'
  - 'website'
overrides:
  # Load-bearing for `pnpm test`, not a tidiness pin. jest reaches babel-jest
  # through babel-preset-jest -> babel-preset-current-node-syntax, whose
  # @babel/plugin-syntax-* are all 7.x with a `@babel/core: ^7.0.0-0` peer, so
  # autoInstallPeers materialises a second core 7 and babel-jest's own
  # `^7.11.0 || ^8.0.0-0` peer settles onto *that* rather than the root's 8.
  # babel-jest then runs Babel 7 against our 8.x presets and stops stripping TS
  # types: every suite dies at the first type annotation with a bare
  # `SyntaxError: Unexpected token ']'` from `new Map<string, X[]>()`, which
  # looks nothing like a resolution problem. Verified still true 2026-08-11.
  # eslint-plugin-react-compiler (dead at 19.1.0-rc.2, hard dep on core ^7.24.4)
  # is a second puller and the one the commit that added this blamed, but
  # removing it does not make the override droppable — jest alone is enough.
  '@babel/core': '^8.0.1'
blockExoticSubdeps: true
# A workspace cycle is a warning by default, and the tree carried 127 of them
# unread. They all came from two edges that had a way out: three plugins taking
# a `dependencies` edge on plugin-data-management for two model types core
# already states structurally, and seven declaring `@jbrowse/web` a
# devDependency for `createTestSession`, which the root package.json already
# declares for the whole tree. Failing the install is what keeps the next one
# from arriving unnoticed.
disallowWorkspaceCycles: true
allowBuilds:
  canvas: true
  electron: true
  electron-chromedriver: true
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: '1440'
minimumReleaseAgeExclude:
  - '@gmod/*'
  - 'ixixx'
  - 'gff-nostream'
  - 'electron'
  - 'generic-filehandle2'
  - '@jbrowse/mobx-state-tree'
  - '@jbrowse/jexl'
  - 'typescript'
  - '@typescript/*'
  - 'astro'
  - '@astrojs/*'
  - 'mobx@7.0.0'
  - 'mobx-react@10.0.0'
  - 'mobx-react-lite@5.0.0'
  - '@bruits/satteri-darwin-arm64@0.10.3'
  - '@bruits/satteri-darwin-x64@0.10.3'
  - '@bruits/satteri-linux-arm64-gnu@0.10.3'
  - '@bruits/satteri-linux-arm64-musl@0.10.3'
  - '@bruits/satteri-linux-x64-gnu@0.10.3'
  - '@bruits/satteri-linux-x64-musl@0.10.3'
  - '@bruits/satteri-wasm32-wasi@0.10.3'
  - '@bruits/satteri-win32-arm64-msvc@0.10.3'
  - '@bruits/satteri-win32-x64-msvc@0.10.3'
  - satteri@0.10.3
