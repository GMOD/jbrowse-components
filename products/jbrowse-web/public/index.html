<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A fast and flexible genome browser" />
    <!-- for AI browser agents, which read the DOM and never think to probe
         window globals: the page's scripting API and where its contract is -->
    <meta
      name="ai-instructions"
      content="This page exposes window.jb, a scripting API for driving the genome browser. Evaluate jb.help for the contract, then orient with jb.sessionSummary(); mutate only through model actions."
    />
    <link rel="manifest" href="manifest.json" />
    <title>JBrowse</title>
    <style>
      /* Disable horizontal overscroll behavior to prevent unintended navigation gestures */
      * {
        overscroll-behavior-x: none;
      }
      /* the app's first frame in the default light theme, painted before any
         script runs; src/bootShell.ts removes it when the app renders */
      #boot-shell {
        position: fixed;
        inset: 0;
        background: #fff;
      }
      .no-boot-shell #boot-shell {
        display: none;
      }
      .boot-shell-header {
        height: 48px;
        background: #0d233f;
        box-shadow:
          0 2px 4px -1px rgba(0, 0, 0, 0.2),
          0 4px 5px 0 rgba(0, 0, 0, 0.14),
          0 1px 10px 0 rgba(0, 0, 0, 0.12);
      }
      .boot-shell-view {
        margin: 2px;
        padding: 28px 4px 4px;
        border-radius: 4px;
        background: #4f1545;
        box-shadow:
          0 7px 8px -4px rgba(0, 0, 0, 0.2),
          0 12px 17px 2px rgba(0, 0, 0, 0.14),
          0 5px 22px 4px rgba(0, 0, 0, 0.12);
      }
      /* ViewLoadingScreen's height, which replaces it */
      .boot-shell-view > div {
        height: 85px;
        border-radius: 4px;
        background: #fff;
      }
    </style>
    <script id="boot-shell-theme">
      ;(function () {
        try {
          var themeName = localStorage.getItem('themeName')
          var themeMode = localStorage.getItem('themeMode')
          if (
            (themeName && themeName !== 'default') ||
            (themeMode && themeMode !== 'light') ||
            localStorage.getItem('themeModeOverride') === 'dark'
          ) {
            document.documentElement.classList.add('no-boot-shell')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="boot-shell" aria-hidden="true">
      <div class="boot-shell-header"></div>
      <div class="boot-shell-view"><div></div></div>
    </div>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `yarn build` or `yarn build`.
    -->
  </body>
</html>
