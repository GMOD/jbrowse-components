  <text x="590" y="664" text-anchor="middle" font-size="13" fill="#333333">An inversion lights the two same-strand bands, each holding one end of the junction; a tandem duplication lights the outward band;</text>
  <text x="590" y="686" text-anchor="middle" font-size="13" fill="#333333">a deletion leaves ordinary-facing pairs that are simply too far apart. A call with every band empty has no read-pair evidence behind it.</text>
