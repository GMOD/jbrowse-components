<!--
  Why a read pair crossing an inversion junction has both ends facing the same
  way. Drawn rather than argued, because the argument it replaces was one clause
  in a callout ("...where ordinary pairs nest") and a reader meeting the pileup
  for the first time has no idea what nesting would look like.

  The mechanism is one thing and the figure shows only that thing: an inverted
  segment carries the reads inside it, so a pair straddling a junction has one
  end flipped and the other not. Everything else about an inversion — arc shape,
  clustering at the junctions, depth — is a consequence, and is in the real
  frame beside it.

  TWO ROWS, NOT THREE, and the title states the conclusion (review: "just show
  the last two, and then make it clear that if you see these overlapping green
  and blue pairs, that it is often an inversion"). The dropped row was a proper
  pair on the reference, and it was redundant the moment the bottom row existed:
  that row flips the SAME two pairs back and so shows the ordinary case with the
  reader's own pairs rather than with a third one. What was lost with it was the
  word "overlapping" having somewhere to point, which the span marker under the
  carrier's reads now is — the pairs interleave (navy's left end sits between
  green's two ends) where the flipped-back pairs sit side by side.

  THE SECOND ROW IS AN OPERATION, AND FOUR TIE LINES SAY SO (review: "the 'not
  inverted' should be more like 'But imagine if you flipped around the
  inversion, then it would straighten out the reads'. you can even draw lines
  from part 1 of the figure to part 2 if it helps"). One line per read, from
  where it sits on the carrier to where it sits once the segment is turned back.
  Two of them run straight down — those reads are outside the segment and the
  flip does not touch them — and the two inside it CROSS, which is the whole
  mechanism in one mark: the green pair's right end and the navy pair's left end
  trade places and turn around, and that is what leaves each pair pointing at
  its own mate.

  The lines are drawn before either row, so the genome bars occlude them and
  each one reads as passing behind the sequence. Two things were moved to keep
  the corridor clear rather than routed around: the overlap label sits left of
  its marker, and "inverted" sits at the block's left edge. The crossing pair's
  control points hold them vertical out of row 1 for the same reason — a curve
  that starts leaning immediately crosses the "inverted" label at x 540-590.

  Colours are the app's own pair-orientation palette (COLOR_TABLE
  alignments-pair-orientation in sv_visualization.md), so a reader can carry them
  straight from here into the pileup: LL green, RR navy, ordinary pair grey. The
  grey is drawn a shade darker than #d3d3d3, which is invisible on white at this
  stroke width. The tie lines take their pair's colour, which is what makes the
  crossing legible; the reads they land on stay grey, because grey is what the
  palette means by an ordinary pair and that is the row's whole claim.

  Hand-authored SVG rather than graphviz: this is a picture of geometry along one
  axis, and a layout engine has nothing to decide.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="20" fill="#222222">Overlapping green and navy pairs often mean an inversion</text>

  <!-- ── the tie lines, first so both rows paint over them ─────────────── -->
  <g fill="none" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.55">
    <!-- outside the segment: unmoved -->
    <path d="M330 140 L330 366" stroke="#33682f"/>
    <path d="M850 140 L850 366" stroke="#3a3a8c"/>
    <!-- inside it: the two that trade places -->
    <path d="M630 140 C630 270 500 280 500 366" stroke="#33682f"/>
    <path d="M490 140 C490 270 640 280 640 366" stroke="#3a3a8c"/>
  </g>
  <g stroke="none">
    <path d="M330 372 L325 362 L335 362 Z" fill="#33682f" opacity="0.55"/>
    <path d="M500 372 L495 362 L505 362 Z" fill="#33682f" opacity="0.55"/>
    <path d="M850 372 L845 362 L855 362 Z" fill="#3a3a8c" opacity="0.55"/>
    <path d="M640 372 L635 362 L645 362 Z" fill="#3a3a8c" opacity="0.55"/>
  </g>

  <!-- ── row 1: the carrier ───────────────────────────────────────────── -->
  <g transform="translate(0 66)">
    <text x="14" y="60" font-size="14" font-weight="bold" fill="#222222">Inversion carrier</text>
    <text x="14" y="80" font-size="12.5" fill="#555555">the segment, and</text>
    <text x="14" y="97" font-size="12.5" fill="#555555">every read in it,</text>
    <text x="14" y="114" font-size="12.5" fill="#555555">is turned around</text>

    <!-- genome, with the inverted segment marked out. It sits 30px lower than
         the flipped-back row's does, to leave the overlap marker a lane of its
         own between the reads and the sequence. -->
    <rect x="200" y="126" width="230" height="12" fill="#d9dde1"/>
    <rect x="430" y="124" width="270" height="16" fill="#e9edf2" stroke="#9fb0c0"/>
    <rect x="700" y="126" width="280" height="12" fill="#d9dde1"/>
    <!-- chevrons pointing back the other way: this is the whole change -->
    <path d="M488 126 L478 132 L488 138 M568 126 L558 132 L568 138 M648 126 L638 132 L648 138" fill="none" stroke="#7d90a3" stroke-width="2"/>
    <text x="565" y="158" text-anchor="middle" font-size="12" fill="#7d90a3">inverted</text>

    <!-- the two junctions, carried up to the reads: "crossing a junction" is
         the condition, and without these the reader has to infer it from which
         reads happen to sit over the tinted block -->
    <path d="M430 44 L430 168 M700 44 L700 168" fill="none" stroke="#b5c2cd" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="430" y="182" text-anchor="middle" font-size="11" fill="#8b98a4">junction</text>
    <text x="700" y="182" text-anchor="middle" font-size="11" fill="#8b98a4">junction</text>

    <!-- LL: left end outside, right end inside and therefore flipped -->
    <path d="M300 56 L352 56 L360 65 L352 74 L300 74 Z" fill="#4d9a4d" stroke="#33682f"/>
    <path d="M600 56 L652 56 L660 65 L652 74 L600 74 Z" fill="#4d9a4d" stroke="#33682f"/>
    <path d="M330 52 Q480 16 630 52" fill="none" stroke="#33682f" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="480" y="8" text-anchor="middle" font-size="12.5" fill="#33682f">LL — both ends forward</text>

    <!-- RR: left end inside and flipped, right end outside -->
    <path d="M520 56 L468 56 L460 65 L468 74 L520 74 Z" fill="#5555bb" stroke="#3a3a8c"/>
    <path d="M880 56 L828 56 L820 65 L828 74 L880 74 Z" fill="#5555bb" stroke="#3a3a8c"/>
    <path d="M490 42 Q685 -2 850 42" fill="none" stroke="#3a3a8c" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="800" y="8" text-anchor="middle" font-size="12.5" fill="#3a3a8c">RR — both ends reverse</text>

    <!-- the span the title's word "overlapping" names: navy starts inside green
         and ends outside it, so the two pairs interleave. Ticked at both ends so
         it reads as a measured span rather than as another read. -->
    <path d="M460 84 L460 96 M660 84 L660 96 M460 90 L660 90" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
    <text x="450" y="94" text-anchor="end" font-size="11.5" fill="#666666">the two pairs overlap here</text>
  </g>

  <!-- ── row 2: the same two pairs, with the segment turned back ───────── -->
  <g transform="translate(0 316)">
    <text x="14" y="60" font-size="14" font-weight="bold" fill="#222222">Flip the segment back</text>
    <text x="14" y="80" font-size="12.5" fill="#555555">and the same two pairs</text>
    <text x="14" y="97" font-size="12.5" fill="#555555">straighten out</text>

    <rect x="200" y="96" width="230" height="12" fill="#d9dde1"/>
    <rect x="430" y="94" width="270" height="16" fill="#e9edf2" stroke="#9fb0c0"/>
    <rect x="700" y="96" width="280" height="12" fill="#d9dde1"/>
    <path d="M478 96 L488 102 L478 108 M558 96 L568 102 L558 108 M638 96 L648 102 L638 108" fill="none" stroke="#7d90a3" stroke-width="2"/>

    <path d="M300 56 L352 56 L360 65 L352 74 L300 74 Z" fill="#c9c9c9" stroke="#7a7a7a"/>
    <path d="M530 56 L478 56 L470 65 L478 74 L530 74 Z" fill="#c9c9c9" stroke="#7a7a7a"/>
    <path d="M330 52 Q415 20 500 52" fill="none" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="5 4"/>

    <path d="M610 56 L662 56 L670 65 L662 74 L610 74 Z" fill="#c9c9c9" stroke="#7a7a7a"/>
    <path d="M880 56 L828 56 L820 65 L828 74 L880 74 Z" fill="#c9c9c9" stroke="#7a7a7a"/>
    <path d="M640 52 Q745 20 850 52" fill="none" stroke="#7a7a7a" stroke-width="1.6" stroke-dasharray="5 4"/>

    <text x="560" y="128" text-anchor="middle" font-size="12.5" fill="#555555">each points at its own mate, and the two pairs do not overlap</text>
  </g>
</svg>
