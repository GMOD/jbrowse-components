[files]
extend-exclude = [
  # generated: `pnpm gendocs` writes these from source
  "website/docs/models/",
  "website/docs/config/",
  # fixture and reference data
  "test_data/",
  "plugins/legacy-jbrowse/test_data/",
  "plugins/spreadsheet-view/src/SpreadsheetView/test_data/",
  "products/aws/lambda-functions/",
  "*.ix",
  "*.ixx",
  "*.nh",
  "*.fa",
  "*.svg",
  "*.tai",
  "*.gff3.gz",
  "*.snap",
  "website/static/pagefind/",  # build output, absent in a fresh checkout
  "website/diagrams/rpc_lifecycle.dot",
  # recorded human review comments, kept verbatim
  "website/scripts/screenshot-review.json",
  # vendored
  "packages/core/src/ui/react-colorful.ts",
  # the typos are the fixtures: this file tests that `--cigarMode ful` is reported
  "products/jbrowse-img/src/options.ts",
  "products/jbrowse-img/src/options.test.ts",
  # long encoded session/color strings, not prose
  "products/jbrowse-web/src/tests/Loader.test.tsx",
  "packages/core/src/util/color/randomColor.test.ts",
  # shell locals din/rin/dout read as words
  "scripts/build_ag1000g_ld.sh",
]
