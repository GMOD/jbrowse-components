<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129516;</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        --ground: #f4f6f8;
        --surface: #fff;
        --surface-2: #eaeef4;
        --ink: #131820;
        --muted: #5a6474;
        --line: #dde2ea;
        --line-strong: #c3cbd8;
        --accent: #34457f;
        --accent-soft: #e7ebf7;
        --keep: #2c7a55;
        --keep-soft: #e2f2ea;
        --reject: #b04238;
        --reject-soft: #fbe8e6;
        --edit: #96681a;
        --edit-soft: #f9eed8;
        --on-cls: #fff;
        --c-merge: #6d28d9;
        --c-merge-soft: #f3e8ff;
        --c-structure-conflict: #b45309;
        --c-structure-conflict-soft: #ffedd5;
        --c-novel-locus: #0f766e;
        --c-novel-locus-soft: #ccfbf1;
        --c-novel-coding: #1d4ed8;
        --c-novel-coding-soft: #dbeafe;
        --shadow:
          0 1px 2px rgba(19, 24, 32, 0.06),
          0 8px 24px -12px rgba(19, 24, 32, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --ground: #10131a;
          --surface: #181d26;
          --surface-2: #212733;
          --ink: #e6eaf2;
          --muted: #98a2b3;
          --line: #2b3240;
          --line-strong: #3a4356;
          --accent: #93a6ea;
          --accent-soft: #222a44;
          --keep: #62bd91;
          --keep-soft: #17301f;
          --reject: #e88b80;
          --reject-soft: #351c1c;
          --edit: #d9ad5c;
          --edit-soft: #32270f;
          --on-cls: #10131a;
          --c-merge: #c4b5fd;
          --c-merge-soft: #2a2148;
          --c-structure-conflict: #f0b27a;
          --c-structure-conflict-soft: #3a2a14;
          --c-novel-locus: #5eead4;
          --c-novel-locus-soft: #10312e;
          --c-novel-coding: #93b4fc;
          --c-novel-coding-soft: #1b2a4d;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
        }
      }
      :root[data-theme='dark'] {
        --ground: #10131a;
        --surface: #181d26;
        --surface-2: #212733;
        --ink: #e6eaf2;
        --muted: #98a2b3;
        --line: #2b3240;
        --line-strong: #3a4356;
        --accent: #93a6ea;
        --accent-soft: #222a44;
        --keep: #62bd91;
        --keep-soft: #17301f;
        --reject: #e88b80;
        --reject-soft: #351c1c;
        --edit: #d9ad5c;
        --edit-soft: #32270f;
        --on-cls: #10131a;
        --c-merge: #c4b5fd;
        --c-merge-soft: #2a2148;
        --c-structure-conflict: #f0b27a;
        --c-structure-conflict-soft: #3a2a14;
        --c-novel-locus: #5eead4;
        --c-novel-locus-soft: #10312e;
        --c-novel-coding: #93b4fc;
        --c-novel-coding-soft: #1b2a4d;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
      }
      [data-cls='merge'] {
        --cls: var(--c-merge);
        --cls-soft: var(--c-merge-soft);
      }
      [data-cls='structure-conflict'] {
        --cls: var(--c-structure-conflict);
        --cls-soft: var(--c-structure-conflict-soft);
      }
      [data-cls='novel-locus'] {
        --cls: var(--c-novel-locus);
        --cls-soft: var(--c-novel-locus-soft);
      }
      [data-cls='novel-coding'] {
        --cls: var(--c-novel-coding);
        --cls-soft: var(--c-novel-coding-soft);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 80px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      h1 {
        font-family: 'Familjen Grotesk', sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin: 0;
        text-wrap: balance;
      }
      .eyebrow {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .lede {
        max-width: 66ch;
        color: var(--muted);
        margin: 0;
      }
      .lede strong {
        color: var(--ink);
        font-weight: 600;
      }
      .masthead {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .controls {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row1 {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px 22px;
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .stat .n {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 20px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .stat .k {
        font-size: 11.5px;
        color: var(--muted);
      }
      .stat.agrees .n {
        color: var(--keep);
      }
      .stat.flagged .n {
        color: var(--edit);
      }
      .rule {
        width: 1px;
        align-self: stretch;
        background: var(--line);
      }
      .progress {
        flex: 1;
        min-width: 180px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .progress .r {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--surface-2);
        overflow: hidden;
        display: flex;
      }
      .bar span {
        height: 100%;
        transition: width 0.25s ease;
      }
      .b-keep {
        background: var(--keep);
      }
      .b-edit {
        background: var(--edit);
      }
      .b-reject {
        background: var(--reject);
      }

      .row2 {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sep {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 4px;
      }
      button,
      select,
      input[type='search'] {
        font: inherit;
        font-size: 13px;
        border-radius: 7px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        color: var(--ink);
        padding: 6px 11px;
        transition:
          background 0.12s,
          border-color 0.12s,
          color 0.12s;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: var(--surface-2);
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .filters button {
        background: var(--cls, var(--accent));
        border-color: transparent;
        color: var(--on-cls);
        font-weight: 600;
      }
      .filters button:hover {
        background: var(--cls, var(--accent));
        filter: brightness(1.1);
      }
      .filters button[aria-pressed='true'] {
        box-shadow:
          0 0 0 2px var(--surface),
          0 0 0 4px var(--cls, var(--accent));
      }
      .filters .count {
        font-family: 'IBM Plex Mono', monospace;
        opacity: 0.8;
        margin-left: 7px;
        font-variant-numeric: tabular-nums;
      }
      input[type='search'] {
        min-width: 190px;
      }
      .spacer {
        margin-left: auto;
      }

      .cards {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--verdict, var(--line));
        border-left: 5px solid var(--cls, var(--verdict, var(--line)));
        border-radius: 10px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .card[data-verdict='keep'] {
        --verdict: var(--keep);
      }
      .card[data-verdict='reject'] {
        --verdict: var(--reject);
      }
      .card[data-verdict='edit'] {
        --verdict: var(--edit);
      }
      .card-head {
        background: var(--cls-soft);
        display: flex;
        flex-wrap: wrap;
        gap: 9px 15px;
        align-items: baseline;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .chip {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 5px;
        background: var(--cls, var(--accent));
        color: var(--on-cls);
        white-space: nowrap;
      }
      .model {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 14px;
        font-weight: 500;
      }
      .genes {
        font-weight: 600;
      }
      .meta {
        margin-left: auto;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .why {
        padding: 12px 18px 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 78ch;
      }
      .detail {
        padding: 6px 18px 0;
        font-size: 13.5px;
        max-width: 78ch;
        color: var(--ink);
      }
      .detail b {
        color: var(--cls, var(--accent));
        font-weight: 600;
      }
      .detail .j {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12.5px;
      }
      .shot {
        display: block;
        width: 100%;
        height: auto;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        margin-top: 13px;
        background: #fff;
      }
      .missing {
        margin: 13px 0 0;
        padding: 26px 18px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--muted);
        font-size: 13.5px;
      }
      .card-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        align-items: center;
        padding: 13px 18px;
      }
      .verdicts {
        display: flex;
        gap: 7px;
      }
      .verdicts button[aria-pressed='true'][data-v='keep'] {
        background: var(--keep-soft);
        border-color: var(--keep);
        color: var(--keep);
        font-weight: 600;
      }
      .verdicts button[aria-pressed='true'][data-v='edit'] {
        background: var(--edit-soft);
        border-color: var(--edit);
        color: var(--edit);
        font-weight: 600;
      }
      .verdicts button[aria-pressed='true'][data-v='reject'] {
        background: var(--reject-soft);
        border-color: var(--reject);
        color: var(--reject);
        font-weight: 600;
      }
      .next {
        font-size: 13px;
        color: var(--muted);
      }
      .next b {
        color: var(--ink);
        font-weight: 600;
      }
      .links {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      a.live {
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
        text-decoration: none;
        border: 1px solid var(--accent);
        border-radius: 7px;
        padding: 6px 13px;
        white-space: nowrap;
      }
      a.live.apollo {
        background: var(--accent);
        color: var(--on-cls);
      }
      a.live.apollo:hover {
        filter: brightness(1.15);
      }
      a.live:hover {
        background: var(--accent-soft);
      }
      a.live:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .card[data-current='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .msg {
        font-size: 12.5px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .keys {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 20px;
        align-items: center;
        font-size: 12.5px;
        color: var(--muted);
        border-top: 1px solid var(--line);
        padding-top: 11px;
      }
      .keys kbd {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px;
        color: var(--ink);
        background: var(--surface-2);
        border: 1px solid var(--line-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 1px 6px;
        margin-right: 4px;
      }
      .empty {
        padding: 44px 18px;
        text-align: center;
        color: var(--muted);
        background: var(--surface);
        border: 1px dashed var(--line-strong);
        border-radius: 10px;
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        background: var(--surface-2);
        border-radius: 8px;
        padding: 10px 14px;
      }
      footer {
        border-top: 1px solid var(--line);
        padding-top: 20px;
        color: var(--muted);
        font-size: 13.5px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        max-width: 78ch;
      }
      footer code {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 12.5px;
        color: var(--ink);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
      @media (max-width: 640px) {
        h1 {
          font-size: 27px;
        }
        .meta {
          margin-left: 0;
          width: 100%;
        }
        .links {
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">__APP_HTML__</div>
    <script id="portal-data" type="application/json">
      __DATA__
    </script>
    <script>
      __APP_JS__
    </script>
  </body>
</html>
