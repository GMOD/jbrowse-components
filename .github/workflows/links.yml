# The weekly sweep for drift in state this repo does not own: every external URL
# written down here — docs prose, tutorial reproduce scripts, demo and test
# configs, screenshot specs — plus the demo configs' own contents, which live in
# an S3 bucket the repo only keeps a copy of.
#
# Off the PR path on purpose, same reasoning as the figure sweep: nearly every
# URL here belongs to somebody else (jbrowse.org's own bucket, hgdownload, ENCODE,
# a journal, a GitHub release), so a required check built on them fails on their
# outage rather than on the change under review. The failure this catches is slow
# — a bucket key moves, a release asset gains a version, a vendor reorganizes its
# docs — so a weekly run finds it long before a reader does.
name: Links

on:
  schedule:
    # Mondays 07:00 UTC, an hour after the figure sweep so the two aren't
    # hammering jbrowse.org's bucket at once
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  external:
    name: External link sweep
    runs-on: ubuntu-latest
    # The sweep is ~6 minutes; the ceiling is for a host that hangs rather than
    # refuses, which the per-request --max-time already bounds.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Probe every external URL
        run: pnpm --filter @jbrowse/website-astro check-external-links

  # Same shape as the sweep above, and here for the same reason: the repo's
  # demos/<name>/config.json is a copy of a file that lives in an S3 bucket
  # anyone can overwrite, so the drift is in someone else's state and no commit
  # controls when it appears. That rules out a PR gate and rules in a schedule.
  #
  # The failure is silent and expensive. These configs used to live only in S3,
  # hand-edited through `aws s3 cp`, which made a dropped track invisible in
  # review and — on an unversioned bucket — unrecoverable: ecoli_pangenome lost
  # its `ecoli_ava` track that way and four figures failed with "Could not
  # resolve identifier". Nothing else asks the question, and the figure sweep
  # cannot: a demo whose track vanished still renders, just without the track.
  demo-configs:
    name: Demo config drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compare each repo copy against what is live
        run: pnpm check-demo-configs
