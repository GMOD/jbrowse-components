name: Windows desktop

# release.yml calls this to build, sign and publish the release's Windows app.
# Dispatched by hand, it signs under SignPath's test-signing policy (or
# release-signing) and keeps the result as a workflow artifact instead of
# publishing it — the way to check the SignPath setup without a tag.
on:
  workflow_call:
    inputs:
      signing-policy:
        type: string
        required: true
      publish:
        type: boolean
        required: true
    secrets:
      SIGNPATH_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      signing-policy:
        type: choice
        options:
          - test-signing
          - release-signing
        default: test-signing

permissions:
  contents: read

jobs:
  # Signing runs here rather than inside the packaging script: SignPath signs an
  # uploaded GitHub Actions artifact, so each signature is an upload, a signing
  # request and a download, and the build resumes around them (see
  # buildWindows). Two of them, because the exe Windows runs and the installer
  # electron-updater checks are different files and both need a publisher. The
  # artifact configurations live in .signpath/artifact-configurations/.
  #
  # Every request waits for a human to approve it in SignPath — that approval is
  # a condition of the Foundation certificate, not a setting — so the timeouts
  # below are sized for a person, not for a service.
  buildwindows:
    name: Build Windows desktop app
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The SignPath action reads the run's jobs and downloads the artifact it
      # submits through the Actions API, neither of which `contents` covers.
      actions: read
    env:
      WINDOWS_TEST_SIGNING:
        ${{ inputs.signing-policy == 'test-signing' && 'true' || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — pnpm install must run after the native build deps below
      # so native modules rebuild against them.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      # Linux-native makensis, which cross-compiles the Windows installer just
      # as the Wine-hosted one did — and which push CI already compiles this
      # script with (nsis_installer_script). The Wine route it replaces was
      # NSIS-under-Wine in a root container; once the container went, wineboot
      # refused the /tmp prefix it had always used ("'/tmp' is not owned by
      # you") and no tagged release built a Windows binary again.
      - name: Install build deps and NSIS
        run: |
          sudo apt update
          sudo apt install -y nsis \
            python3 make gcc libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package the app
        run: pnpm package:win:no-installer
        working-directory: products/jbrowse-desktop

      # if-no-files-found: error, on both uploads — the path spells out a naming
      # rule that artifacts.ts owns, and the default is to warn and upload
      # nothing, which signs nothing and leaves the step green.
      - name: Upload the unsigned app exe
        id: unsigned-app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jbrowse-desktop-win-app-unsigned
          path: products/jbrowse-desktop/dist/unpacked/jbrowse-desktop-win32-x64/jbrowse-desktop.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the app exe
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: jbrowse-components
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: windows-app-exe
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          # Unpacked back over the file it was made from, so the installer wraps
          # the signed exe.
          output-artifact-directory: products/jbrowse-desktop/dist/unpacked/jbrowse-desktop-win32-x64

      - name: Build the installer around the signed exe
        run: pnpm package:win:installer
        working-directory: products/jbrowse-desktop
      - name: Upload the unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jbrowse-desktop-win-installer-unsigned
          path: products/jbrowse-desktop/dist/*-win.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: jbrowse-components
          signing-policy-slug: ${{ inputs.signing-policy }}
          artifact-configuration-slug: windows-installer
          github-artifact-id:
            ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: products/jbrowse-desktop/dist

      # Checks both signatures came home and measures the signed installer into
      # latest.yml — a hash taken before signing describes a file nobody can
      # download.
      - name: Write the update manifest
        run: pnpm package:win:finalize
        working-directory: products/jbrowse-desktop
      - name: Upload to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish:win
        working-directory: products/jbrowse-desktop
      - name: Keep the signed installer as a workflow artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jbrowse-desktop-win-${{ inputs.signing-policy }}
          path: |
            products/jbrowse-desktop/dist/*-win.exe
            products/jbrowse-desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
