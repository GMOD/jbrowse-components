name: Release
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFRONT_DISTRIBUTION_ID: E13LGELJOT4GQO

jobs:
  # Push runs on this tag too, and used to run alongside this workflow rather
  # than before it. See .github/actions/require-push-ci. Everything below hangs
  # off createrelease, so gating that gates the desktop builds and the latest/
  # deploy with it.
  gate:
    name: Wait for Push CI
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-push-ci
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  createrelease:
    name: Create release tag and JBrowse web release artifacts
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # A prerelease tag carries a '-' (v4.4.0-beta.1). A stable tag always
    # builds Windows, failing if it cannot be signed. A prerelease skips it until
    # the repo variable WINDOWS_RELEASE_SIGNING is 'true', set once SignPath's
    # release-signing policy exists, so betas still ship Linux and Mac.
    outputs:
      prerelease: ${{ contains(github.ref_name, '-') }}
      windows: ${{ env.WINDOWS }}
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      WINDOWS:
        ${{ (!contains(github.ref_name, '-') || vars.WINDOWS_RELEASE_SIGNING ==
        'true') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The desktop jobs derive their upload target from package.json, not from
      # the tag — `gh release upload "v$VERSION" --clobber`. A tag that doesn't
      # match the tree's version therefore uploads this build's binaries over
      # *another* release's assets, silently and irreversibly. Nothing
      # downstream can catch that, so fail the whole run here before any job
      # that uploads has started. See check-tag-version.ts.
      - name: Check the tag matches the version in the tree
        run: node scripts/check-tag-version.ts "${RELEASE_VERSION}"
      - name: Build jbrowse-web
        uses: ./.github/actions/build-jbrowse-web
      # Upload the pristine build (before the versioned zip is added to it) so
      # buildjbrowseweb can deploy the same bytes to latest/ without rebuilding.
      - name: Upload jbrowse-web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jbrowse-web-build
          path: products/jbrowse-web/build
          include-hidden-files: true
          retention-days: 1
      - name: Zip jbrowse-web build
        uses: ./.github/actions/zip-jbrowse-web
        with:
          filename: jbrowse-web-${{ env.RELEASE_VERSION }}.zip
      # The blog post is committed in the tag, so the body no longer needs
      # pasting in by hand. Best-effort: a tag without a post still gets a
      # draft to collect binaries, just an empty body.
      #
      # SignPath's terms ask for the attribution and the term "Code signing
      # policy" on every page that offers a binary they signed, so the footer
      # goes on exactly when a Windows build does.
      - name: Generate release notes
        run: |
          if ! node scripts/releasenotes.ts --tag "${RELEASE_VERSION}" > /tmp/notes.md; then
            echo "_Release notes pending._" > /tmp/notes.md
            echo "::warning::No blog post for ${RELEASE_VERSION}; release body left empty. Expected for a prerelease."
          fi
          if [ "${WINDOWS}" != true ]; then
            exit 0
          fi
          cat >> /tmp/notes.md <<'FOOTER'

          ---

          Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org) — see our [Code signing policy](https://jbrowse.org/jb2/code-signing-policy/).
          FOOTER
      # The flag, not just the '-', is what the desktop auto-updater,
      # `jbrowse create`/`upgrade`, and announce.yml gate on.
      #
      # Stays a draft: the desktop jobs upload binaries into it long after this
      # job ends, and publishing fires announce.yml. For a stable tag that click
      # is the gate; a prerelease publishes itself once verifydesktop is green.
      #
      # Idempotent, because re-running this job is the obvious recovery from a
      # transient failure in it — and `gh release create` refuses outright once
      # the release exists, so the recovery used to be the one thing that could
      # not work.
      - name: Create draft release with jbrowse-web artifact
        run: |
          ZIP=./products/jbrowse-web/build/jbrowse-web-${RELEASE_VERSION}.zip
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            # Only the artifact. Not --draft, --title or --notes-file: by the
            # time a re-run happens the release may have been published or its
            # notes edited by hand, and re-asserting --draft would silently
            # unpublish it.
            echo "::notice::Release ${RELEASE_VERSION} already exists; refreshing its jbrowse-web artifact only."
            gh release upload "${RELEASE_VERSION}" "$ZIP" --clobber
          else
            gh release create "${RELEASE_VERSION}" "$ZIP" \
              --draft ${PRERELEASE_FLAG} \
              --title "Release ${RELEASE_VERSION}" \
              --notes-file /tmp/notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG:
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
  buildwindows:
    needs: createrelease
    if: ${{ needs.createrelease.outputs.windows == 'true' }}
    name: Build Windows desktop app
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/windows-desktop.yml
    with:
      signing-policy: release-signing
      publish: true
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  buildmac:
    needs: createrelease
    name: Build Mac desktop app
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — pnpm install must run after the brew native build deps
      # below so native modules rebuild against them.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Install build dependencies
        run: |
          brew install pkg-config cairo pango libpng jpeg giflib librsvg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CSC_LINK" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          rm $RUNNER_TEMP/certificate.p12
      # `find-identity -v` lists only unexpired, trusted identities, which is
      # also how @electron/osx-sign chooses one — so an expired certificate
      # reads here as an empty list. The one in CSC_LINK expired 2026-06-04,
      # and the three releases after that each packaged an unsigned app instead
      # of saying so.
      - name: Check the signing identity is usable
        run: |
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q 'Developer ID Application'; then
            echo "::error::No valid Developer ID Application identity. CSC_LINK/CSC_KEY_PASSWORD need a current Developer ID certificate for team 9KR53J86Q2."
            exit 1
          fi
      - name: Build Mac app
        env:
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLEIDPASS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release-electron:mac
        working-directory: products/jbrowse-desktop
      - name: Clean up keychain
        if: always()
        run:
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  buildlinux:
    needs: createrelease
    name: Build Linux desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          apt-packages:
            python3 make gcc libcairo2-dev libpango1.0-dev libjpeg-dev
            libgif-dev librsvg2-dev
      - name: Build Linux app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release-electron:linux
        working-directory: products/jbrowse-desktop

  # Three green jobs is not the same claim as a complete release: each uploads
  # its own platform, and a release missing one platform's latest*.yml is one
  # that platform silently stops updating from. Reads the draft, so the answer
  # is there before the Publish click that is the real gate. It runs after a
  # failed platform build too, and names what the release lacks. It skips a
  # failed createrelease, which leaves no draft to check.
  # `contents: write` only because GitHub hides drafts from a read-only token:
  # with `read`, v5.0.0-beta.7's complete draft reported "no release".
  verifydesktop:
    name: Verify the release carries every desktop artifact
    needs: [createrelease, buildwindows, buildmac, buildlinux]
    if: ${{ !cancelled() && needs.createrelease.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — the script reads package.json and shells out to gh;
      # nothing here needs node_modules.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Check every artifact and manifest is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORMS:
            ${{ needs.createrelease.outputs.windows == 'true' && '' ||
            '--platform linux --platform mac' }}
        run: pnpm check:release ${PLATFORMS}
        working-directory: products/jbrowse-desktop

  # A prerelease never becomes GitHub's "latest", so publishing one reaches only
  # beta installs: electron-updater lets a prerelease install see prereleases,
  # and a stable install resolves its check through /releases/latest, which
  # skips them. announce.yml skips prereleases too, so no click is needed.
  publishprerelease:
    name: Publish the prerelease
    needs: [createrelease, verifydesktop]
    # Stated outright: the implicit success() reads a skipped buildwindows
    # upstream of verifydesktop as a reason to skip this job too.
    if: >-
      !cancelled() && needs.verifydesktop.result == 'success' &&
      needs.createrelease.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run:
          gh release edit "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}"
          --draft=false --prerelease

  buildjbrowseweb:
    name: Deploy jbrowse-web to latest folder on tag
    # Reuse the build createrelease already produced instead of rebuilding.
    needs: createrelease
    # Only stable tags update the canonical latest/ folder; a prerelease tag
    # must not overwrite it.
    if: ${{ needs.createrelease.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only for .github/actions/zip-jbrowse-web, and it has to precede the
      # download: checkout cleans untracked files out of the workspace, which
      # would take the downloaded build with it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download jbrowse-web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jbrowse-web-build
          path: products/jbrowse-web/build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Zip jbrowse-web build
        uses: ./.github/actions/zip-jbrowse-web
        with:
          filename: jbrowse-web-latest.zip
      - name: Deploy to S3
        uses: ./.github/actions/deploy-jbrowse-web
        with:
          prefix: code/jb2/latest
          distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
