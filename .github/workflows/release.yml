name: Release
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFRONT_DISTRIBUTION_ID: E13LGELJOT4GQO

jobs:
  # Push runs on this tag too, and used to run alongside this workflow rather
  # than before it. See .github/actions/require-push-ci. Everything below hangs
  # off createrelease, so gating that gates the desktop builds and the latest/
  # deploy with it.
  gate:
    name: Wait for Push CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-push-ci
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  createrelease:
    name: Create release tag and JBrowse web release artifacts
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Consumed below so the prerelease flag and the latest/ gate can't drift.
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Classify the release tag
        id: tag
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> "$GITHUB_ENV"
          # A prerelease tag carries a '-' (v4.4.0-beta.1).
          case "${GITHUB_REF#refs/tags/}" in
            *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac
      # The desktop jobs derive their upload target from package.json, not from
      # the tag — `gh release upload "v$VERSION" --clobber`. A tag that doesn't
      # match the tree's version therefore uploads this build's binaries over
      # *another* release's assets, silently and irreversibly. Nothing
      # downstream can catch that, so fail the whole run here before any job
      # that uploads has started. See check-tag-version.ts.
      - name: Check the tag matches the version in the tree
        run: node scripts/check-tag-version.ts "${RELEASE_VERSION}"
      - name: Build jbrowse-web
        uses: ./.github/actions/build-jbrowse-web
      # Upload the pristine build (before the versioned zip is added to it) so
      # buildjbrowseweb can deploy the same bytes to latest/ without rebuilding.
      - name: Upload jbrowse-web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jbrowse-web-build
          path: products/jbrowse-web/build
          include-hidden-files: true
          retention-days: 1
      - name: Zip jbrowse-web build
        uses: ./.github/actions/zip-jbrowse-web
        with:
          filename: jbrowse-web-${{ env.RELEASE_VERSION }}.zip
      # The blog post is committed in the tag, so the body no longer needs
      # pasting in by hand. Best-effort: a tag without a post still gets a
      # draft to collect binaries, just an empty body.
      #
      # The signing footer goes on either body: this page is where the desktop
      # binaries are downloaded from, and SignPath's terms ask for the
      # attribution and the term "Code signing policy" on every such page.
      - name: Generate release notes
        run: |
          if ! node scripts/releasenotes.ts --tag "${RELEASE_VERSION}" > /tmp/notes.md; then
            echo "_Release notes pending._" > /tmp/notes.md
            echo "::warning::No blog post for ${RELEASE_VERSION}; release body left empty. Expected for a prerelease."
          fi
          cat >> /tmp/notes.md <<'FOOTER'

          ---

          Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org) — see our [Code signing policy](https://jbrowse.org/jb2/code-signing-policy/).
          FOOTER
      # The flag, not just the '-', is what the desktop auto-updater,
      # `jbrowse create`/`upgrade`, and announce.yml gate on.
      #
      # Stays a draft: the desktop jobs upload binaries into it long after this
      # job ends, and publishing fires announce.yml. That click is the gate.
      #
      # Idempotent, because re-running this job is the obvious recovery from a
      # transient failure in it — and `gh release create` refuses outright once
      # the release exists, so the recovery used to be the one thing that could
      # not work.
      - name: Create draft release with jbrowse-web artifact
        run: |
          ZIP=./products/jbrowse-web/build/jbrowse-web-${RELEASE_VERSION}.zip
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            # Only the artifact. Not --draft, --title or --notes-file: by the
            # time a re-run happens the release may have been published or its
            # notes edited by hand, and re-asserting --draft would silently
            # unpublish it.
            echo "::notice::Release ${RELEASE_VERSION} already exists; refreshing its jbrowse-web artifact only."
            gh release upload "${RELEASE_VERSION}" "$ZIP" --clobber
          else
            gh release create "${RELEASE_VERSION}" "$ZIP" \
              --draft ${PRERELEASE_FLAG} \
              --title "Release ${RELEASE_VERSION}" \
              --notes-file /tmp/notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG:
            ${{ steps.tag.outputs.prerelease == 'true' && '--prerelease' || ''
            }}
  # Signing runs here rather than inside the packaging script: SignPath signs an
  # uploaded GitHub Actions artifact, so each signature is an upload, a signing
  # request and a download, and the build resumes around them (see
  # buildWindows). Two of them, because the exe Windows runs and the installer
  # electron-updater checks are different files and both need a publisher.
  #
  # Every request waits for a human to approve it in SignPath — that approval is
  # a condition of the Foundation certificate, not a setting — so the timeouts
  # below are sized for a person, not for a service.
  buildwindows:
    needs: createrelease
    name: Build Windows desktop app
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The SignPath action reads the run's jobs and downloads the artifact it
      # submits through the Actions API, neither of which `contents` covers.
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — pnpm install must run after the native build deps below
      # so native modules rebuild against them.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      # Linux-native makensis, which cross-compiles the Windows installer just
      # as the Wine-hosted one did — and which push CI already compiles this
      # script with (nsis_installer_script). The Wine route it replaces was
      # NSIS-under-Wine in a root container; once the container went, wineboot
      # refused the /tmp prefix it had always used ("'/tmp' is not owned by
      # you") and no tagged release built a Windows binary again.
      - name: Install build deps and NSIS
        run: |
          sudo apt update
          sudo apt install -y nsis \
            python3 make gcc libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package the app
        run: pnpm package:win:no-installer
        working-directory: products/jbrowse-desktop

      # if-no-files-found: error, on both uploads — the path spells out a naming
      # rule that artifacts.ts owns, and the default is to warn and upload
      # nothing, which signs nothing and leaves the step green.
      - name: Upload the unsigned app exe
        id: unsigned-app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jbrowse-desktop-win-app-unsigned
          path: products/jbrowse-desktop/dist/unpacked/jbrowse-desktop-win32-x64/jbrowse-desktop.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the app exe
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: jbrowse-components
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-app-exe
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          # Unpacked back over the file it was made from, so the installer wraps
          # the signed exe.
          output-artifact-directory: products/jbrowse-desktop/dist/unpacked/jbrowse-desktop-win32-x64

      - name: Build the installer around the signed exe
        run: pnpm package:win:installer
        working-directory: products/jbrowse-desktop
      - name: Upload the unsigned installer
        id: unsigned-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jbrowse-desktop-win-installer-unsigned
          path: products/jbrowse-desktop/dist/*-win.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: jbrowse-components
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-installer
          github-artifact-id:
            ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: '3600'
          output-artifact-directory: products/jbrowse-desktop/dist

      # Checks both signatures came home and measures the signed installer into
      # latest.yml — a hash taken before signing describes a file nobody can
      # download.
      - name: Write the update manifest
        run: pnpm package:win:finalize
        working-directory: products/jbrowse-desktop
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish:win
        working-directory: products/jbrowse-desktop

  buildmac:
    needs: createrelease
    name: Build Mac desktop app
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — pnpm install must run after the brew native build deps
      # below so native modules rebuild against them.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Install build dependencies
        run: |
          brew install pkg-config cairo pango libpng jpeg giflib librsvg
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CSC_LINK" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          rm $RUNNER_TEMP/certificate.p12
      # `find-identity -v` lists only unexpired, trusted identities, which is
      # also how @electron/osx-sign chooses one — so an expired certificate
      # reads here as an empty list. The one in CSC_LINK expired 2026-06-04,
      # and the three releases after that each packaged an unsigned app instead
      # of saying so.
      - name: Check the signing identity is usable
        run: |
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q 'Developer ID Application'; then
            echo "::error::No valid Developer ID Application identity. CSC_LINK/CSC_KEY_PASSWORD need a current Developer ID certificate for team 9KR53J86Q2."
            exit 1
          fi
      - name: Build Mac app
        env:
          APPLE_ID: ${{ secrets.APPLEID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLEIDPASS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release-electron:mac
        working-directory: products/jbrowse-desktop
      - name: Clean up keychain
        if: always()
        run:
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  buildlinux:
    needs: createrelease
    name: Build Linux desktop app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — pnpm install must run after the native build deps below
      # so native modules rebuild against them.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 make gcc libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Linux app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release-electron:linux
        working-directory: products/jbrowse-desktop

  # Three green jobs is not the same claim as a complete release: each uploads
  # its own platform, and a release missing one platform's latest*.yml is one
  # that platform silently stops updating from. Reads the draft, so the answer
  # is there before the Publish click that is the real gate; `if: always()` so
  # an incomplete release says so rather than being inferred from a red sibling.
  # `contents: write` only because GitHub hides drafts from a read-only token:
  # with `read`, v5.0.0-beta.7's complete draft reported "no release".
  verifydesktop:
    name: Verify the release carries every desktop artifact
    needs: [buildwindows, buildmac, buildlinux]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — the script reads package.json and shells out to gh;
      # nothing here needs node_modules.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Check every artifact and manifest is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:release
        working-directory: products/jbrowse-desktop

  buildjbrowseweb:
    name: Deploy jbrowse-web to latest folder on tag
    # Reuse the build createrelease already produced instead of rebuilding.
    needs: createrelease
    # Only stable tags update the canonical latest/ folder; a prerelease tag
    # must not overwrite it.
    if: ${{ needs.createrelease.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      # Only for .github/actions/zip-jbrowse-web, and it has to precede the
      # download: checkout cleans untracked files out of the workspace, which
      # would take the downloaded build with it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download jbrowse-web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jbrowse-web-build
          path: products/jbrowse-web/build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Zip jbrowse-web build
        uses: ./.github/actions/zip-jbrowse-web
        with:
          filename: jbrowse-web-latest.zip
      # The sync carries all of test_data, unlike the zip above: the docs' and
      # gallery's live links are `<code base>?config=test_data/…`, so they
      # resolve out of what lands here. Cache headers and upload order as in
      # push.yml's deploy.
      - name: Copy branch build to S3
        run: |
          cd products/jbrowse-web/build
          cp test_data/config.json config.json
          DEST=s3://jbrowse.org/code/jb2/latest
          aws s3 sync --cache-control "public, max-age=31536000, immutable" static $DEST/static
          aws s3 sync --exclude="static/*" --exclude=index.html --exclude=config.json . $DEST
          aws s3 cp --cache-control no-cache config.json $DEST/config.json
          aws s3 cp --cache-control no-cache index.html $DEST/index.html
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/code/jb2/latest/*"
