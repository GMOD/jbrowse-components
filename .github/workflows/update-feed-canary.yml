# What a running JBrowse Desktop sees when it checks for an update, asked
# without shipping a release to find out.
#
# electron-updater resolves the check to whatever GitHub calls this repo's
# latest release, then reads latest-<platform>.yml out of it. Publishing the
# release draft before the build jobs upload moves "latest" to a tag with no
# manifests, and so would a non-`v` release published after a `v` one, since
# GitHub picks latest by date and this repo has tags of both shapes. Either
# takes every existing install offline for updates, silently.
#
# Off the PR path, like blat-canary.yml: a red run is a fact about the releases,
# not about the commit under test.
#
# When it goes red: the named platform is not updating. Upload the missing
# artifacts to the release the run names (`pnpm release-electron:<os>` produces
# them), or, if a stray release has taken "latest", mark it as a prerelease.
name: Update feed canary

on:
  release:
    types: [published]
  schedule:
    # Monday 07:00 UTC, after the BLAT canary's daily slot
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-feed:
    name: The desktop update feed resolves and is complete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # install: false — the script reads package.json and shells out to gh;
      # nothing here needs node_modules.
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Resolve the update check the way Desktop does
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:update-feed
        working-directory: products/jbrowse-desktop
