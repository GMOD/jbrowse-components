name: Figures

# The weekly sweep of the website's 329 figure specs.
#
# SCHEDULED, NOT A PR GATE, and that is a measurement rather than a preference:
# 318 of the 329 specs fetch from jbrowse.org, hgdownload or an ENCODE bucket, so
# a required check built on them would fail on somebody else's outage instead of
# on the change under review. That is the same trap the cross-backend gate's
# comment describes — the version of it that ran continue-on-error over
# everything "published a drift log nobody read" — so this does not pretend to be
# a gate. It is the periodic answer to a question nothing else asks.
#
# The question: which published figures no longer match the app? The generator
# only rewrites a PNG whose capture actually changed, so the set of figures this
# job moves IS the answer. Two regressions found by running this by hand once (an
# MST error banner over both dotplot import forms, and a lost side-by-side
# layout) had been published for weeks with every other check green, because a
# figure that goes wrong still renders, still passes, and still looks like a
# figure.
#
# That answer used to be read out of `git status`. It is now read out of
# figures.lock, because figure bytes live in the S3 store rather than in git
# (website/scripts/figure-store.ts) and an untracked PNG never shows up in
# `git status` at all — the old form would have reported "0 figures moved" every
# week, forever, and looked exactly like a clean sweep.
#
# The report is strictly better for it: every revision the store has ever held
# is still fetchable at its own immutable URL, so the summary renders BEFORE and
# AFTER side by side instead of shipping a directory of PNGs to diff by hand.
#
# It is also the oracle for `--affected` (see website/scripts/screenshot-impact.ts):
# a PNG this rewrites that `--affected` would not have selected is a bug in that
# map. The artifact is what you diff to find out.
#
# Weekly, not nightly: ~30 min of runner time, and figures do not rot faster than
# that. Run it on demand with the Actions "Run workflow" button after a change
# you expect to move things.

on:
  schedule:
    # Mondays 06:00 UTC — a full week of merges, sitting in the artifact before
    # anyone starts the week's work
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    name: Weekly figure sweep
    runs-on: ubuntu-latest
    # The sweep itself is ~30 min; the ceiling is for a spec whose remote host
    # hangs rather than refuses, which would otherwise burn the default 6 hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Before the sweep, not after: the generator's content-stable gate diffs a
      # fresh capture against the figure already on disk, so without these every
      # spec would look brand new and get written unconditionally — and the run
      # would report all 329 as moved.
      - name: Install figures
        run: pnpm figures:pull
      - name: Build jbrowse-web
        uses: ./.github/actions/build-jbrowse-web
      # The `cliSpec` figures shell out to jb2export, which runs from source and
      # resolves `@jbrowse/core/x` to `packages/core/esm/x.js` through its own
      # loader hook (products/jbrowse-img/src/resolve.ts). Without the ESM build
      # that hook throws before the CLI renders anything, and every one of those
      # specs fails — 26 of the 38 failures on the first two runs of this
      # workflow, all reported as "Command failed" with the real reason buried
      # in a stack trace. build-jbrowse-web above is a webpack bundle of the
      # app; it does not produce esm/.
      - name: Build the ESM output the jb2export specs resolve against
        run: pnpm build:esm
      # `embedded` specs screenshot the react-linear-genome-view component out
      # of its UMD bundle rather than the app, and fail with "Embedded UMD not
      # found" without it. This is the second half of what website's
      # `screenshots:build` script already does locally; the workflow had only
      # the first.
      - name: Build the embedded UMD bundle
        run: pnpm --filter @jbrowse/react-linear-genome-view2 build:webpack
      # The generator shells out to ImageMagick and pngquant for the diff gate
      # and the optimizer; without them every capture would ship unquantized and
      # the content-stable gate could not run at all.
      # librsvg2-bin is for the jb2export specs, not the diff gate: jb2export
      # renders SVG and shells out to `rsvg-convert` whenever --out ends in
      # .png, so without it all 26 of them die on `spawnSync rsvg-convert
      # ENOENT`. website/docs/jbrowse-img.md has always named the package; the
      # runner just never installed it, and the ESM build gap above was masking
      # this one — those specs could not get far enough to reach the converter.
      - name: Install ImageMagick, pngquant and rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get -y install imagemagick pngquant librsvg2-bin
      # Fails the run when a SPEC fails — a view that would not launch, a display
      # that never painted, an error banner in the frame. A figure that merely
      # moved is not a failure; it is the artifact below.
      - name: Sweep
        run: node scripts/generate-screenshots.ts
        working-directory: website
      # Publish the bytes the sweep produced, then say what moved.
      #
      # The upload has to happen before anyone reads the report, because the
      # report's AFTER column is a store URL. It is also additive and can only
      # ever create keys named after their own contents, so a sweep nobody
      # adopts leaves orphan blobs and nothing else — a few MB a week against a
      # ~$0.03/month bill, which is the right trade for a report a reviewer can
      # actually look at.
      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Publish what the sweep rendered
        if: always()
        run: pnpm figures:push
      # BEFORE is the manifest at HEAD, AFTER is the one `push` just wrote, and
      # both sides resolve to immutable public URLs — so the summary is a
      # side-by-side of every figure that moved, rendered inline, with the
      # resize and byte deltas called out. `report` writes markdown; GitHub
      # renders the <img> tags in it.
      - name: Report what moved
        if: always()
        run: |
          pnpm figures:report --base HEAD --markdown --out /tmp/figures.md
          cat /tmp/figures.md >> "$GITHUB_STEP_SUMMARY"
      # The lock file is the whole deliverable now: drop it on top of a checkout
      # and `pnpm figures:pull` reproduces exactly what this run rendered. It
      # replaces an artifact that used to ship the PNGs themselves.
      - name: Upload the manifest and any debug captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: figures-that-moved
          path: |
            figures.lock
            /tmp/figures.md
            website/debug-screenshots
          retention-days: 14
          if-no-files-found: ignore
