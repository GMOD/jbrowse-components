name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'
      # The dist-tag below is read off the tag name, but the version actually
      # published is each package.json's — and `pnpm publish -r` ships every
      # package at whatever its own manifest says. See check-tag-version.ts;
      # unpublishing is only possible for 72 hours, so this is checked before,
      # not noticed after.
      - name: Check the tag matches the version in the tree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-tag-version.ts "$RELEASE_TAG"
      # npm never infers a dist-tag from prerelease semver, it publishes as
      # 'latest' unless told otherwise, which would serve a beta to every
      # `npm install` and to the unpkg @latest URLs in the docs. 'latest' is
      # npm's own default, so stable tags behave exactly as before.
      - run:
          pnpm publish -r --access public --no-git-checks --provenance --tag
          "$NPM_TAG"
        env:
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
