name: Deploy jbrowse-web
description:
  Sync products/jbrowse-web/build to an S3 prefix of jbrowse.org and invalidate
  it in CloudFront

inputs:
  prefix:
    description: Key prefix under s3://jbrowse.org, e.g. code/jb2/main
    required: true
  delete:
    description:
      Remove keys outside static/ that the build no longer has ('true'); static/
      has its own prune
    default: 'false'
  distribution-id:
    description: CloudFront distribution serving jbrowse.org
    required: true

# One copy of the upload order and cache headers for the per-ref deploy in
# push.yml and the latest/ deploy in release.yml. Two copies had drifted:
# latest/ shipped source maps and never pruned a chunk.
#
# The sync carries all of test_data, unlike the zip: the docs' and gallery's
# live links are `<code base>?config=test_data/…`, so they resolve out of what
# lands here. release.yml leaves `delete` off, because latest/ holds test_data
# no current build has and old docs may still link to it.
#
# static/ is content-hashed, so browsers may keep it without re-checking, and
# the sync skips any key already there at the same size.
# index.html goes up after the chunks it names, and prune-s3-chunks then drops
# what no deploy of the last 30 days shipped.
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: products/jbrowse-web/build
      env:
        PREFIX: ${{ inputs.prefix }}
        DELETE: ${{ inputs.delete }}
      run: |
        cp test_data/config.json config.json
        DEST=s3://jbrowse.org/$PREFIX
        delete=()
        if [ "$DELETE" = true ]; then delete=(--delete); fi
        aws s3 sync --size-only --exclude="*.map" --cache-control "public, max-age=31536000, immutable" static "$DEST/static"
        aws s3 sync "${delete[@]}" --exclude="*.map" --exclude="static/*" --exclude=index.html --exclude=config.json . "$DEST"
        aws s3 cp --cache-control no-cache config.json "$DEST/config.json"
        aws s3 cp --cache-control no-cache index.html "$DEST/index.html"
    - uses: ./.github/actions/prune-s3-chunks
      with:
        dir: products/jbrowse-web/build/static
        prefix: ${{ inputs.prefix }}/static/
    - shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
        DISTRIBUTION_ID: ${{ inputs.distribution-id }}
      run:
        aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID"
        --paths "/$PREFIX/*"
