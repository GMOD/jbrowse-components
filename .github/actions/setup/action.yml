name: Setup
description:
  Install pnpm + Node, apt packages and (optionally) project dependencies

# Shared preamble for every pnpm-based job. Checkout must run in the job before
# this (a local composite action needs the repo already on disk), so this owns
# only the pnpm/Node/install trio — the part that was hand-duplicated ~20x with
# its pinned SHAs and version numbers kept in sync by hand.
inputs:
  node-version:
    description: Node version for actions/setup-node
    default: '24'
  registry-url:
    description: npm registry to configure (for publish/provenance jobs)
    default: ''
  apt-packages:
    description:
      Space-separated apt packages, installed before `pnpm install` so native
      modules build against them
    default: ''
  install:
    description: Run `pnpm install --frozen-lockfile` (set 'false' to skip)
    default: 'true'
  working-directory:
    description: Directory to install in when install is enabled
    default: '.'

runs:
  using: composite
  steps:
    # No version input: action-setup reads the root packageManager field, so the
    # pnpm version lives in exactly one place.
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    # The package archive is the flakiest thing a job touches: a stalled
    # `apt-get update` once held a main run until its job timeout, and on
    # 2026-11-11 every Canonical host timed out from the runners for hours,
    # over HTTP and HTTPS alike, while third-party mirrors answered in under a
    # second. So the .debs are cached per runner image and package list and
    # installed with dpkg, which never reaches the network (apt refuses local
    # debs under --no-download, and without it may fetch the same version from
    # the archive instead). The archive is reached only on a miss, and a retry
    # goes to kernel.org's mirror, which carries the security pocket too.
    # An older image's cache is not tried: when its debs half-install, the
    # fallback fetches only what is missing, and that partial set would be
    # cached under the new image's key.
    - if: inputs.apt-packages != ''
      id: apt-key
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        hash=$(tr ' ' '\n' <<<"$APT_PACKAGES" | sed '/^$/d' | sort -u | sha256sum | cut -c1-12)
        echo "key=apt-debs-$ImageOS-$hash-$ImageVersion" >>"$GITHUB_OUTPUT"
        echo "dir=$RUNNER_TEMP/apt-debs" >>"$GITHUB_OUTPUT"
    - if: inputs.apt-packages != ''
      id: apt-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}
    - if: inputs.apt-packages != ''
      id: apt-install
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
        DEBS: ${{ steps.apt-key.outputs.dir }}
        DEBIAN_FRONTEND: noninteractive
      run: |
        if compgen -G "$DEBS/*.deb" >/dev/null && sudo -E dpkg -i "$DEBS"/*.deb; then
          echo "installed from the cached debs"
          exit 0
        fi
        rm -rf "$DEBS"
        mkdir -p "$DEBS/partial"
        apt=(sudo -E timeout 120 apt-get -o Acquire::Retries=3
          -o Dir::Cache::Archives="$DEBS" -o APT::Keep-Downloaded-Packages=true)
        for attempt in 1 2 3; do
          if "${apt[@]}" update && "${apt[@]}" install -y -f &&
            "${apt[@]}" install -y $APT_PACKAGES; then
            sudo rm -rf "$DEBS/partial" "$DEBS/lock"
            echo "fetched=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apt attempt $attempt failed"
          { grep -rls apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d || true; } |
            xargs -r sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#https://mirrors.edge.kernel.org/ubuntu/#'
        done
        exit 1
    - if: steps.apt-install.outputs.fetched == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.key }}
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
