name: Setup
description:
  Install pnpm + Node, apt packages and (optionally) project dependencies

# Shared preamble for every pnpm-based job. Checkout must run in the job before
# this (a local composite action needs the repo already on disk), so this owns
# only the pnpm/Node/install trio — the part that was hand-duplicated ~20x with
# its pinned SHAs and version numbers kept in sync by hand.
inputs:
  node-version:
    description: Node version for actions/setup-node
    default: '24'
  registry-url:
    description: npm registry to configure (for publish/provenance jobs)
    default: ''
  apt-packages:
    description:
      Space-separated apt packages, installed before `pnpm install` so native
      modules build against them
    default: ''
  install:
    description: Run `pnpm install --frozen-lockfile` (set 'false' to skip)
    default: 'true'
  working-directory:
    description: Directory to install in when install is enabled
    default: '.'

runs:
  using: composite
  steps:
    # No version input: action-setup reads the root packageManager field, so the
    # pnpm version lives in exactly one place.
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
    # The timeout and retries are for a package archive that hangs rather than
    # refuses: a stalled `apt-get update` once held a main run until its job
    # timeout. A mirror that stalls on one package usually serves it on a fresh
    # attempt, so the whole install is retried rather than failing the job.
    - if: inputs.apt-packages != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        apt=(sudo timeout 120 apt-get -o Acquire::Retries=3)
        for attempt in 1 2 3; do
          if "${apt[@]}" update && "${apt[@]}" install -y $APT_PACKAGES; then
            exit 0
          fi
          echo "apt attempt $attempt failed"
        done
        exit 1
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
